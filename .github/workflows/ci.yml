      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Show Python version
        run: python --version

      - name: Show installed packages
        run: pip list

      - name: Run tests
        run: python -m pytest test_grade.py -v